<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRROR HUNTER | SECURE VERIFICATION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.google.com/recaptcha/api.js?render={{ RECAPTCHA_SITE_KEY }}"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b1020;
            color: #e5e7eb;
        }
        .mh-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        .btn-continue {
            background: #22c55e;
            color: #ffffff;
            transition: all 0.3s ease;
        }
        .btn-continue:hover:not(:disabled) {
            background: #16a34a;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }
        .btn-continue:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="mh-card w-full max-w-md rounded-2xl p-8 text-center space-y-6 relative overflow-hidden">
        <div class="shimmer absolute inset-0 pointer-events-none"></div>

        <div class="relative z-10 space-y-6">
            <div class="flex justify-center">
                <img src="https://hunter-deploy.onrender.com/static/IMG_20250815_183617_729.jpg"
                     alt="Mirror Hunter"
                     class="w-24 h-24 rounded-2xl shadow-2xl border border-white/10">
            </div>

            <div class="space-y-2">
                <h1 class="text-2xl font-extrabold tracking-tight text-white">Verify</h1>
                <div class="h-1 w-12 bg-green-500 mx-auto rounded-full"></div>
            </div>

            <div id="status-area" class="space-y-4">
                <div class="space-y-1">
                    <p class="text-sm font-semibold text-green-400">Verification in progress</p>
                    <p class="text-xs text-slate-400">Please stay here while we finish the check.</p>
                </div>

                <div class="flex items-center justify-center space-x-2 text-xs text-slate-500 bg-white/5 py-2 rounded-lg">
                    <i class="fas fa-sync fa-spin text-green-500"></i>
                    <span class="font-medium">Secure handshake running</span>
                </div>
            </div>

            <div id="error-ui" class="hidden space-y-4">
                <div class="p-3 bg-red-500/10 border border-red-500/20 rounded-lg text-red-400 text-xs">
                    <p id="error-text">Verification failed</p>
                </div>
                <button onclick="location.reload()" class="w-full py-3 rounded-xl font-bold text-sm bg-white/5 hover:bg-white/10 transition-colors">
                    Try Again
                </button>
            </div>

            <button id="continue-btn" disabled class="btn-continue w-full py-4 rounded-xl font-extrabold text-sm uppercase tracking-widest shadow-lg shadow-green-500/20">
                Continue
            </button>

            <div class="pt-4 border-t border-white/5">
                <p class="text-[10px] text-slate-600 font-bold uppercase tracking-tighter">
                    Protected by reCAPTCHA
                </p>
            </div>
        </div>
    </div>

    <script>
        let recaptchaToken = null;

        window.onload = function() {
            grecaptcha.ready(() => {
                grecaptcha.execute('{{ RECAPTCHA_SITE_KEY }}', {action: 'redirect'}).then(token => {
                    recaptchaToken = token;
                    document.getElementById('continue-btn').disabled = false;
                });
            });
        };

        document.getElementById('continue-btn').onclick = async function() {
            if (!recaptchaToken) return;

            const btn = this;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Verifying...';

            try {
                const response = await fetch('/r2/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        recaptchaToken: recaptchaToken,
                        linkToken: "{{ TOKEN }}",
                        userId: "{{ USER_ID }}"
                    })
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = data.data.redirect;
                } else {
                    showError(data.message);
                }
            } catch (err) {
                showError('Connection Error');
            }
        };

        function showError(msg) {
            if (msg.includes("Bypass Detected")) {
                window.location.href = "/banned";
                return;
            }
            document.getElementById('status-area').classList.add('hidden');
            document.getElementById('continue-btn').classList.add('hidden');
            document.getElementById('error-ui').classList.remove('hidden');
            document.getElementById('error-text').textContent = msg;
        }
    </script>
</body>
</html>
