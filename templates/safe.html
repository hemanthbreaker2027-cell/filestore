<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTAKULUX | Security Check</title>
    <script src="https://www.google.com/recaptcha/api.js?render={{ RECAPTCHA_SITE_KEY }}"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.02);
            padding: 50px 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 450px;
            width: 90%;
            position: relative;
        }
        .brand {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 25px;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #00d2ff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-box {
            margin-top: 30px;
            padding: 15px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.03);
            font-size: 0.95rem;
            color: #00d2ff;
            font-weight: 600;
            transition: all 0.3s;
        }
        .error {
            color: #ff4b2b;
            background: rgba(255, 75, 43, 0.1);
            border: 1px solid rgba(255, 75, 43, 0.2);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 0, 127, 0.1);
            border-top: 3px solid #ff007f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        p { color: #888; margin-bottom: 0; }
        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #444;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">OTAKULUX</div>
        <div class="spinner"></div>
        <h2 style="font-weight: 400; margin-bottom: 10px;">Security Verification</h2>
        <p>Initializing secure connection...</p>
        <div id="status" class="status-box">Requesting authentication...</div>
        <div class="footer">Protected by AI-Powered Anti-Bot System</div>
    </div>

    <script>
        const SITE_KEY = "{{ RECAPTCHA_SITE_KEY }}";
        const LINK_ID = "{{ LINK }}";

        async function init() {
            const status = document.getElementById('status');

            try {
                // 1. Forced Human-like delay (Fast end of 1-3s range)
                await new Promise(r => setTimeout(r, 1000));

                status.innerText = "Executing reCAPTCHA v3...";

                grecaptcha.ready(function() {
                    grecaptcha.execute(SITE_KEY, {action: 'verify_safe'}).then(async function(captchaToken) {
                        status.innerText = "Authenticating with backend...";

                        // 2. Strict backend verification
                        const response = await fetch('/api/verify_safe', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-Requested-With': 'XMLHttpRequest'
                            },
                            body: JSON.stringify({
                                link: LINK_ID,
                                captcha: captchaToken
                            })
                        });

                        const result = await response.json();

                        if (result.success) {
                            status.innerText = "Verification complete...";
                            // 3. Google redirect method
                            setTimeout(() => {
                                window.location.href = result.redirect;
                            }, 500);
                        } else {
                            setTimeout(() => window.location.reload(), 2000);
                        }
                    });
                });
            } catch (err) {
                setTimeout(() => window.location.reload(), 2000);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
