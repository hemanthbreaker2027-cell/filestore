<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTAKULUX - Premium Anime Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0a0a0b;
        }
        .neon-pink { color: #ff00ff; text-shadow: 0 0 10px rgba(255, 0, 255, 0.5); }
        .neon-blue { color: #00ffff; text-shadow: 0 0 10px rgba(0, 255, 255, 0.5); }
        .bg-glass { background: rgba(18, 18, 20, 0.8); backdrop-filter: blur(12px); }
        .border-neon { border-color: rgba(255, 0, 255, 0.2); }
        .border-neon:hover { border-color: rgba(255, 0, 255, 0.6); box-shadow: 0 0 20px rgba(255, 0, 255, 0.1); }
        .card-shadow { box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="text-white min-h-screen">
    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 bg-glass border-b border-white/5 px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold bg-gradient-to-r from-pink-500 to-blue-500 bg-clip-text text-transparent">OTAKULUX</h1>
        <div class="hidden md:flex gap-8 text-sm font-medium text-gray-400">
            <a href="/" class="hover:text-white transition-colors">Home</a>
            <a href="#" class="hover:text-white transition-colors">Trending</a>
            <a href="#" class="hover:text-white transition-colors">Movies</a>
            <a href="#" class="hover:text-white transition-colors">Browse</a>
        </div>
        <div class="flex items-center gap-4">
            <input id="search-input" type="text" placeholder="Search..." class="bg-[#1a1a1c] border border-white/10 rounded-full px-4 py-1.5 text-sm focus:outline-none focus:border-pink-500 transition-all">
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="pt-32 pb-12 px-6 md:px-12">
        <div class="max-w-7xl mx-auto">
            <h2 class="text-4xl md:text-6xl font-bold mb-4">Discover the <span class="neon-pink">Unseen</span></h2>
            <p class="text-gray-400 max-w-2xl text-lg">Stream your favorite anime in 4K quality with OTAKULUX. Fast, secure, and always updated with the latest episodes.</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="px-6 md:px-12 pb-24 max-w-7xl mx-auto">
        <!-- Search Results Section (Hidden by default) -->
        <section id="search-section" class="mb-16 hidden">
            <div class="flex justify-between items-center mb-8">
                <h3 id="search-title" class="text-2xl font-bold flex items-center gap-2">
                    <span class="w-2 h-8 bg-yellow-500 rounded-full"></span>
                    Search Results
                </h3>
                <button onclick="clearSearch()" class="text-sm text-gray-400 hover:text-white">Clear</button>
            </div>
            <div id="search-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
                <!-- Search results will be populated here -->
            </div>
        </section>

        <!-- Trending Section -->
        <section id="trending-section" class="mb-16">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-2xl font-bold flex items-center gap-2">
                    <span class="w-2 h-8 bg-pink-500 rounded-full"></span>
                    Trending Now
                </h3>
                <a href="#" class="text-sm text-pink-400 hover:underline">View All</a>
            </div>
            <div id="trending-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
                <!-- Cards will be populated here -->
            </div>
        </section>

        <!-- Latest Section -->
        <section id="latest-section">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-2xl font-bold flex items-center gap-2">
                    <span class="w-2 h-8 bg-blue-500 rounded-full"></span>
                    Latest Episodes
                </h3>
                <a href="#" class="text-sm text-blue-400 hover:underline">View All</a>
            </div>
            <div id="latest-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
                <!-- Cards will be populated here -->
            </div>
        </section>
    </main>

    <script>
        function createCard(anime) {
            return `
                <a href="/watch/${anime.id}" class="group relative bg-[#121214] rounded-2xl overflow-hidden border border-white/5 transition-all duration-300 hover:-translate-y-2 hover:border-pink-500/50 card-shadow">
                    <div class="aspect-[2/3] overflow-hidden">
                        <img src="${anime.img}" alt="${anime.title}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                    </div>
                    <div class="p-4 bg-gradient-to-t from-[#121214] to-transparent">
                        <h4 class="font-bold truncate text-sm mb-1 group-hover:text-pink-400 transition-colors">${anime.title}</h4>
                        <span class="text-xs text-gray-500">Episode ${anime.ep}</span>
                    </div>
                    <div class="absolute inset-0 bg-pink-500/10 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                        <div class="bg-pink-600 p-3 rounded-full shadow-[0_0_20px_rgba(255,0,255,0.4)]">
                            <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.333-5.89a1.5 1.5 0 000-2.538L6.3 2.841z"/></svg>
                        </div>
                    </div>
                </a>
            `;
        }

        async function loadData() {
            try {
                const [trendingRes, latestRes] = await Promise.all([
                    fetch('/api/trending'),
                    fetch('/api/latest')
                ]);

                const trendingData = await trendingRes.json();
                const latestData = await latestRes.json();

                const trendingGrid = document.getElementById('trending-grid');
                const latestGrid = document.getElementById('latest-grid');

                if (trendingData.length > 0) {
                    trendingGrid.innerHTML = trendingData.map(createCard).join('');
                } else {
                    trendingGrid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-12">No trending anime yet.</p>';
                }

                if (latestData.length > 0) {
                    latestGrid.innerHTML = latestData.map(createCard).join('');
                } else {
                    latestGrid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-12">No latest episodes yet.</p>';
                }
            } catch (err) {
                console.error("Failed to load anime data:", err);
            }
        }

        async function performSearch(q) {
            if (!q) {
                clearSearch();
                return;
            }
            const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
            const data = await res.json();

            const searchSection = document.getElementById('search-section');
            const searchGrid = document.getElementById('search-grid');
            const trendingSection = document.getElementById('trending-section');
            const latestSection = document.getElementById('latest-section');

            searchSection.classList.remove('hidden');
            trendingSection.classList.add('hidden');
            latestSection.classList.add('hidden');

            if (data.length > 0) {
                searchGrid.innerHTML = data.map(createCard).join('');
            } else {
                searchGrid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-12">No results found.</p>';
            }
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            document.getElementById('search-section').classList.add('hidden');
            document.getElementById('trending-section').classList.remove('hidden');
            document.getElementById('latest-section').classList.remove('hidden');
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const q = e.target.value;
            if (window.searchTimeout) clearTimeout(window.searchTimeout);
            window.searchTimeout = setTimeout(() => performSearch(q), 500);
        });

        loadData();
    </script>
</body>
</html>
