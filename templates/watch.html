<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ file_name }} | OTAKULUX Player</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff007f;
            --secondary: #00d2ff;
            --bg: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            margin-top: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .brand {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px;
        }
        .file-info {
            margin-bottom: 25px;
        }
        .file-name {
            font-size: 1.2rem;
            font-weight: 500;
            color: #eee;
            word-break: break-all;
            margin-bottom: 8px;
        }
        .file-size {
            font-size: 0.9rem;
            color: #888;
        }
        .player-wrapper {
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            background: #000;
            margin-bottom: 25px;
        }
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            font-size: 1rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #b00058);
            color: #fff;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 0, 127, 0.3);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid var(--glass-border);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        @media (max-width: 600px) {
            .actions { grid-template-columns: 1fr; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand">OTAKULUX</div>
        </div>

        <div class="file-info">
            <div class="file-name">{{ file_name }}</div>
            <div class="file-size">Size: {{ file_size }}</div>
        </div>

        <div class="player-wrapper">
            <video id="player" playsinline controls data-poster="">
                <source src="/stream/{{ payload }}" type="video/mp4" />
            </video>
        </div>

        <div class="actions">
            <a href="/stream/{{ payload }}" class="btn btn-primary">📥 Direct Download</a>
            <a href="vlc:///stream/{{ payload }}" class="btn btn-secondary">🎬 Open in VLC</a>
        </div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script>
        const player = new Plyr('#player', {
            tooltips: { controls: true, seek: true }
        });
    </script>
</body>
</html>
