
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTAKULUX Premium Stream - {{ file_name }}</title>
    <style>
        :root {
            --bg-dark: #09090b;
            --accent-neon: #00ffcc;
            --text-main: #f4f4f5;
            --card-bg: #18181b;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 3rem;
        }

        .navbar {
            width: 100%;
            padding: 1.5rem;
            text-align: center;
            background: rgba(24, 24, 27, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #27272a;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--accent-neon);
            text-transform: uppercase;
        }

        .container {
            width: 95%;
            max-width: 1000px;
            margin-top: 2rem;
        }

        .player-wrapper {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 255, 204, 0.1);
            aspect-ratio: 16 / 9;
            border: 1px solid #27272a;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
        }

        .watermark {
            position: absolute;
            top: 20px;
            right: 20px;
            opacity: 0.6;
            color: var(--accent-neon);
            font-weight: bold;
            font-size: 0.9rem;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        .info-card {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid #27272a;
        }

        .file-title {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--accent-neon);
            word-break: break-all;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            padding: 0.9rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-size: 0.95rem;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn-main { background: var(--accent-neon); color: #000; }
        .btn-best { background: #8b5cf6; color: #fff; }
        .btn-vlc { background: #f97316; color: #fff; }
        .btn-mx { background: #0ea5e9; color: #fff; }
        .btn-playit { background: #ef4444; color: #fff; }

        .footer-watermark {
            margin-top: 3rem;
            font-size: 0.8rem;
            opacity: 0.3;
            letter-spacing: 5px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>OTAKULUX Premium</h1>
    </div>

    <div class="container">
        <div class="player-wrapper">
            <video id="player" controls autoplay preload="auto" playsinline webkit-playsinline>
                <source src="{{ stream_url }}" type="{{ mime_type }}">
                Your browser does not support the video tag.
            </video>
            <div class="watermark">OTAKULUX</div>
        </div>

        <div class="info-card">
            <div class="file-title">{{ file_name }}</div>
            <div class="button-grid">
                <button onclick="openBestPlayer('{{ stream_url }}')" class="btn btn-best">🚀 Best Player</button>
                <a href="{{ stream_url }}" download class="btn btn-main">📥 Download</a>
                <button onclick="openExternalPlayer('vlc', '{{ stream_url }}')" class="btn btn-vlc">▶️ VLC Player</button>
                <button onclick="openExternalPlayer('mx', '{{ stream_url }}')" class="btn btn-mx">▶️ MX Player</button>
                <button onclick="openExternalPlayer('playit', '{{ stream_url }}')" class="btn btn-playit">▶️ PLAYit</button>
            </div>
        </div>
    </div>

    <div class="footer-watermark">OTAKULUX</div>

    <script>
        function openExternalPlayer(player, videoUrl) {
            const absoluteUrl = new URL(videoUrl, window.location.origin).href;
            const encodedUrl = encodeURIComponent(absoluteUrl);
            let intentUrl = "";

            if (player === "vlc") {
                intentUrl = `intent://${encodedUrl}#Intent;package=org.videolan.vlc;type=video/*;end;`;
            } else if (player === "mx") {
                intentUrl = `intent://${encodedUrl}#Intent;package=com.mxtech.videoplayer.ad;type=video/*;end;`;
            } else if (player === "playit") {
                intentUrl = `intent://${encodedUrl}#Intent;package=com.playit.videoplayer;type=video/*;end;`;
            }

            if (intentUrl) {
                window.location.href = intentUrl;

                setTimeout(() => {
                    window.location.href = absoluteUrl; // fallback to browser
                }, 1500);
            }
        }

        function openBestPlayer(videoUrl) {
            const absoluteUrl = new URL(videoUrl, window.location.origin).href;
            openExternalPlayer("vlc", absoluteUrl);

            setTimeout(() => {
                openExternalPlayer("mx", absoluteUrl);
            }, 800);

            setTimeout(() => {
                openExternalPlayer("playit", absoluteUrl);
            }, 1600);

            setTimeout(() => {
                window.location.href = absoluteUrl;
            }, 2500);
        }
    </script>
</body>
</html>
