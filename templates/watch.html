
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTAKULUX Premium Stream - {{ file_name }}</title>
    <style>
        :root {
            --bg-dark: #050505;
            --accent-neon: #ff00ff; /* Neon Pink */
            --accent-blue: #00f2ff; /* Neon Blue */
            --text-main: #ffffff;
            --card-bg: rgba(20, 20, 25, 0.7);
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050505 100%);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 5rem;
        }

        .navbar {
            width: 100%;
            padding: 2rem;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--accent-neon);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.2);
        }

        .navbar h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 5px;
            background: linear-gradient(to right, var(--accent-neon), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            margin-top: 3rem;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .player-wrapper {
            position: relative;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            aspect-ratio: 16 / 9;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
        }

        .watermark {
            position: absolute;
            bottom: 30px;
            left: 30px;
            opacity: 0.5;
            color: #fff;
            font-weight: 900;
            font-size: 1.2rem;
            pointer-events: none;
            text-shadow: 0 0 10px var(--accent-neon);
            letter-spacing: 2px;
        }

        .info-card {
            margin-top: 2rem;
            padding: 2.5rem;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .file-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--accent-blue);
            word-break: break-all;
            text-align: center;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-top: 2.5rem;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 1.2rem;
            border-radius: 15px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        .btn:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            filter: brightness(1.2);
        }

        .btn-main { background: linear-gradient(45deg, var(--accent-neon), #ff0080); color: #fff; }
        .btn-best { background: linear-gradient(45deg, #8b5cf6, #6366f1); color: #fff; border-color: #8b5cf6; }
        .btn-vlc { background: #f97316; color: #fff; }
        .btn-mx { background: #0088cc; color: #fff; }
        .btn-playit { background: #ef4444; color: #fff; }

        .footer-watermark {
            margin-top: 5rem;
            font-size: 1.5rem;
            font-weight: 900;
            opacity: 0.1;
            letter-spacing: 20px;
            color: var(--accent-blue);
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>OTAKULUX Premium</h1>
    </div>

    <div class="container">
        <div class="player-wrapper">
            <video id="player" controls autoplay preload="auto" playsinline webkit-playsinline>
                <source src="{{ stream_url }}" type="{{ mime_type }}">
                Your browser does not support the video tag.
            </video>
            <div class="watermark">OTAKULUX</div>
        </div>

        <div class="info-card">
            <div class="file-title">{{ file_name }}</div>
            <div class="button-grid">
                <button onclick="openBestPlayer('{{ stream_url }}')" class="btn btn-best">🚀 Best Player</button>
                <a href="{{ stream_url }}" download class="btn btn-main">📥 Download</a>
                <button onclick="openExternalPlayer('vlc', '{{ stream_url }}')" class="btn btn-vlc">▶️ VLC Player</button>
                <button onclick="openExternalPlayer('mx', '{{ stream_url }}')" class="btn btn-mx">▶️ MX Player</button>
                <button onclick="openExternalPlayer('playit', '{{ stream_url }}')" class="btn btn-playit">▶️ PLAYit</button>
            </div>
        </div>
    </div>

    <div class="footer-watermark">OTAKULUX</div>

    <script>
        function openExternalPlayer(player, videoUrl) {
            const absoluteUrl = new URL(videoUrl, window.location.origin).href;
            const encodedUrl = encodeURIComponent(absoluteUrl);
            let intentUrl = "";

            if (player === "vlc") {
                intentUrl = `intent://${encodedUrl}#Intent;package=org.videolan.vlc;type=video/*;end;`;
            } else if (player === "mx") {
                intentUrl = `intent://${encodedUrl}#Intent;package=com.mxtech.videoplayer.ad;type=video/*;end;`;
            } else if (player === "playit") {
                intentUrl = `intent://${encodedUrl}#Intent;package=com.playit.videoplayer;type=video/*;end;`;
            }

            if (intentUrl) {
                window.location.href = intentUrl;

                setTimeout(() => {
                    window.location.href = absoluteUrl; // fallback to browser
                }, 1500);
            }
        }

        function openBestPlayer(videoUrl) {
            const absoluteUrl = new URL(videoUrl, window.location.origin).href;
            openExternalPlayer("vlc", absoluteUrl);

            setTimeout(() => {
                openExternalPlayer("mx", absoluteUrl);
            }, 800);

            setTimeout(() => {
                openExternalPlayer("playit", absoluteUrl);
            }, 1600);

            setTimeout(() => {
                window.location.href = absoluteUrl;
            }, 2500);
        }
    </script>
</body>
</html>
