
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream - {{ FILE_NAME }}</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: #050505;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .v-container {
            width: 100%;
            background: #000;
            aspect-ratio: 16 / 9;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        video {
            width: 100%;
            height: 100%;
            outline: none;
        }
        .content {
            padding: 20px 15px;
        }
        .status {
            display: inline-flex;
            align-items: center;
            color: #00ff88;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            background: rgba(0, 255, 136, 0.1);
            padding: 4px 10px;
            border-radius: 4px;
        }
        .status::before {
            content: "";
            width: 6px; height: 6px;
            background: #00ff88;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #00ff88;
        }
        h1 {
            font-size: 18px;
            margin: 0 0 20px 0;
            line-height: 1.4;
            color: #fff;
            font-weight: 700;
        }
        .p-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .p-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #111;
            border: 1px solid #222;
            color: #fff;
            text-decoration: none;
            padding: 15px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .p-btn:active {
            background: #222;
            transform: scale(0.95);
        }
        .p-btn .icon {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .section-title {
            font-size: 11px;
            color: #555;
            font-weight: 800;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }
        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #222;
            margin-left: 10px;
        }
        .footer {
            margin-top: 40px;
            font-size: 10px;
            color: #333;
            text-align: center;
            padding-bottom: 20px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="v-container">
    <video controls autoplay playsinline preload="auto">
        <source src="{{ STREAM_URL }}" type="video/mp4">
    </video>
</div>

<div class="content">
    <div class="status">ENGINE V6 ACTIVE</div>
    <h1>{{ FILE_NAME }}</h1>

    <div class="section-title">External Players</div>

    <div class="p-grid">
        <a href="intent:{{ STREAM_URL }}#Intent;action=android.intent.action.VIEW;type=video/*;S.title={{ FILE_NAME }};package=com.mxtech.videoplayer.ad;end" class="p-btn">
            <span class="icon">Ⓜ️</span>
            MX PLAYER
        </a>
        <a href="intent:{{ STREAM_URL }}#Intent;action=android.intent.action.VIEW;type=video/*;S.title={{ FILE_NAME }};package=org.videolan.vlc;end" class="p-btn">
            <span class="icon">🧡</span>
            VLC PLAYER
        </a>
        <a href="intent:{{ STREAM_URL }}#Intent;action=android.intent.action.VIEW;type=video/*;S.title={{ FILE_NAME }};package=com.gravity.videoplayer;end" class="p-btn">
            <span class="icon">▶️</span>
            PLAYIT
        </a>
        <a href="intent:{{ STREAM_URL }}#Intent;action=android.intent.action.VIEW;type=video/*;S.title={{ FILE_NAME }};end" class="p-btn">
            <span class="icon">⚡</span>
            SYSTEM
        </a>
    </div>
</div>

<div class="footer">
    &copy; 2025 ANIZONEFLIX SECURE STREAMING
</div>

</body>
</html>
