<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>˹ ᴀɴɪᴢᴏɴᴇꜰʟɪx ˼ - {{ FILE_NAME }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1/dist/city/index.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #0ea5e9;
            --secondary: #6366f1;
            --accent: #f43f5e;
            --bg: #030712;
            --glass: rgba(17, 24, 39, 0.75);
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: #f3f4f6;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .anime-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(to bottom, rgba(3, 7, 18, 0.85), rgba(3, 7, 18, 1)),
                        url('https://images.alphacoders.com/132/1322308.png');
            background-size: cover;
            background-position: center;
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .video-container {
            position: relative;
            padding-top: 56.25%;
            border-radius: 2rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .video-js {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .vjs-big-play-centered .vjs-big-play-button {
            width: 80px !important;
            height: 80px !important;
            border-radius: 50% !important;
            line-height: 80px !important;
            background: var(--primary) !important;
            border: none !important;
            box-shadow: 0 0 30px rgba(14, 165, 233, 0.5) !important;
        }

        .action-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.02);
        }

        .action-card:hover {
            transform: translateY(-6px) scale(1.02);
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--primary);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .btn-gradient {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            transition: all 0.3s ease;
        }

        .btn-gradient:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 30px -10px rgba(14, 165, 233, 0.6);
        }

        #toast {
            visibility: hidden;
            min-width: 280px;
            background-color: #1f2937;
            color: #fff;
            text-align: center;
            border-radius: 16px;
            padding: 20px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            transform: translateX(-50%);
            bottom: 30px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }

        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 lg:p-12">
    <div class="anime-bg"></div>

    <div class="max-w-6xl mx-auto space-y-10">
        <!-- Header -->
        <header class="flex items-center justify-between glass-panel p-6 rounded-[2rem]">
            <div class="flex items-center space-x-5">
                <div class="relative">
                    <div class="absolute inset-0 bg-sky-500 blur-2xl opacity-20 animate-pulse"></div>
                    <div class="relative p-4 bg-sky-500/10 rounded-2xl border border-sky-500/20">
                        <i class="fas fa-crown text-sky-400 text-2xl"></i>
                    </div>
                </div>
                <div>
                    <h1 class="text-3xl font-bold tracking-tight text-white">˹ ᴀɴɪᴢᴏɴᴇꜰʟɪx ˼</h1>
                    <div class="flex items-center space-x-2 text-[10px] font-bold uppercase tracking-[0.3em] text-slate-400 mt-1">
                        <span class="flex h-2 w-2 rounded-full bg-emerald-500"></span>
                        <span>Ultra Speed Stream</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Player Section -->
        <main class="space-y-10">
            <div class="video-container glass-panel">
                <video id="ani-player" class="video-js vjs-theme-city vjs-big-play-centered" controls preload="auto">
                    <source src="{{ STREAM_URL }}" type="video/mp4">
                    <p class="vjs-no-js text-center p-10">Please enable JavaScript to view this video.</p>
                </video>
            </div>

            <!-- Content Area -->
            <div class="glass-panel p-10 rounded-[3rem] space-y-12 border-t border-white/5">
                <div class="flex flex-col md:flex-row md:items-end justify-between gap-8">
                    <div class="space-y-6 flex-grow">
                        <div class="flex flex-wrap gap-3">
                            <span class="px-4 py-1.5 bg-sky-500/20 text-sky-400 text-[10px] font-bold uppercase rounded-full border border-sky-500/30">4K HDR</span>
                            <span class="px-4 py-1.5 bg-indigo-500/20 text-indigo-400 text-[10px] font-bold uppercase rounded-full border border-indigo-500/30">Premium Asset</span>
                            <span class="px-4 py-1.5 bg-emerald-500/20 text-emerald-400 text-[10px] font-bold uppercase rounded-full border border-emerald-500/30">Ad Free</span>
                        </div>
                        <h2 class="text-3xl md:text-5xl font-bold text-white leading-tight tracking-tight">{{ FILE_NAME }}</h2>
                        <div class="flex items-center space-x-3 text-slate-400">
                            <i class="fas fa-shield-halved text-sky-500"></i>
                            <span class="text-xs font-bold uppercase tracking-widest">ᴀɴɪᴢᴏɴᴇ ᴘʀᴏᴛᴇᴄᴛᴇᴅ • sᴇᴄᴜʀᴇ ᴅᴇʟɪᴠᴇʀʏ</span>
                        </div>
                    </div>

                    <div class="flex-shrink-0">
                         <a href="{{ DOWNLOAD_URL }}" class="btn-gradient px-12 py-6 rounded-2xl flex items-center space-x-4 group">
                            <i class="fas fa-cloud-arrow-down text-2xl group-hover:scale-110 transition-transform"></i>
                            <span class="font-bold">DOWNLOAD NOW</span>
                        </a>
                    </div>
                </div>

                <div class="h-px bg-white/5"></div>

                <!-- External Player Grid -->
                <div class="space-y-8">
                    <div class="flex items-center gap-6">
                        <span class="text-xs font-bold text-slate-300 uppercase tracking-[0.4em] whitespace-nowrap">Open in Premium Player</span>
                        <div class="h-px flex-grow bg-gradient-to-r from-slate-800 to-transparent"></div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                        <button onclick="openPlayer('mx')" class="action-card flex items-center p-6 rounded-3xl group relative overflow-hidden">
                            <div class="absolute inset-0 bg-sky-500/10 translate-y-full group-hover:translate-y-0 transition-transform duration-500"></div>
                            <div class="relative p-4 bg-sky-500/20 rounded-2xl mr-6 group-hover:bg-sky-500 group-hover:text-white transition-all border border-sky-500/30">
                                <i class="fas fa-play text-xl"></i>
                            </div>
                            <div class="relative text-left">
                                <p class="text-sm font-bold uppercase tracking-widest text-white">MX Player</p>
                                <p class="text-[9px] font-bold text-sky-400 uppercase mt-1">Recommended</p>
                            </div>
                        </button>

                        <button onclick="openPlayer('vlc')" class="action-card flex items-center p-6 rounded-3xl group relative overflow-hidden">
                            <div class="absolute inset-0 bg-orange-500/10 translate-y-full group-hover:translate-y-0 transition-transform duration-500"></div>
                            <div class="relative p-4 bg-orange-500/20 rounded-2xl mr-6 group-hover:bg-orange-500 group-hover:text-white transition-all border border-orange-500/30">
                                <i class="fab fa-vimeo-v text-xl"></i>
                            </div>
                            <div class="relative text-left">
                                <p class="text-sm font-bold uppercase tracking-widest text-white">VLC Media</p>
                                <p class="text-[9px] font-bold text-orange-400 uppercase mt-1">Original Quality</p>
                            </div>
                        </button>

                        <button onclick="openPlayer('playit')" class="action-card flex items-center p-6 rounded-3xl group relative overflow-hidden">
                            <div class="absolute inset-0 bg-indigo-500/10 translate-y-full group-hover:translate-y-0 transition-transform duration-500"></div>
                            <div class="relative p-4 bg-indigo-500/20 rounded-2xl mr-6 group-hover:bg-indigo-500 group-hover:text-white transition-all border border-indigo-500/30">
                                <i class="fas fa-bolt text-xl"></i>
                            </div>
                            <div class="relative text-left">
                                <p class="text-sm font-bold uppercase tracking-widest text-white">PLAYit</p>
                                <p class="text-[9px] font-bold text-indigo-400 uppercase mt-1">Fast & Simple</p>
                            </div>
                        </button>
                    </div>
                </div>

                <div class="flex justify-center">
                    <button onclick="copyToClipboard()" class="flex items-center space-x-3 text-slate-500 hover:text-sky-400 transition-colors py-4">
                        <i class="fas fa-link"></i>
                        <span class="text-[10px] font-bold uppercase tracking-widest">Copy Stream Link</span>
                    </button>
                </div>
            </div>
        </main>

        <footer class="text-center py-12">
            <p class="text-[10px] font-bold uppercase tracking-[0.4em] text-slate-700">
                © 2025 ˹ ᴀɴɪᴢᴏɴᴇꜰʟɪx ˼ • All Rights Reserved
            </p>
        </footer>
    </div>

    <div id="toast"></div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        const player = videojs('ani-player', {
            responsive: true,
            fluid: true,
            playbackRates: [0.5, 1, 1.5, 2]
        });

        const streamUrl = "{{ STREAM_URL }}";

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerHTML = msg;
            toast.className = "show";
            setTimeout(() => { toast.className = ""; }, 3000);
        }

        function openPlayer(type) {
            const fileName = encodeURIComponent("{{ FILE_NAME }}");
            const streamUrl = "{{ STREAM_URL }}";

            const intentMap = {
                mx: `intent:${streamUrl}#Intent;action=android.intent.action.VIEW;package=com.mxtech.videoplayer.ad;S.title=${fileName};end`,
                vlc: `intent:${streamUrl}#Intent;action=android.intent.action.VIEW;package=org.videolan.vlc;S.title=${fileName};end`,
                playit: `intent:${streamUrl}#Intent;action=android.intent.action.VIEW;package=com.playit.videoplayer;S.title=${fileName};end`
            };

            const start = Date.now();
            window.location.href = intentMap[type];

            setTimeout(() => {
                const timeDiff = Date.now() - start;
                // If we're still on the page after 2.5s and the app didn't open (timeDiff is small)
                // We show the toast. Also check document visibility.
                if (timeDiff < 3000 && !document.hidden && !document.webkitHidden) {
                    showToast("<i class='fas fa-circle-exclamation mr-2 text-rose-500'></i> " + type.toUpperCase() + " Player not found!");
                }
            }, 2500);
        }

        function copyToClipboard() {
            navigator.clipboard.writeText(streamUrl).then(() => {
                showToast("<i class='fas fa-check-circle mr-2 text-emerald-400'></i> Link copied to clipboard!");
            });
        }
    </script>
</body>
</html>
