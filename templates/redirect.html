<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTAKULUX | Verifying Access</title>
    <script src="https://www.google.com/recaptcha/api.js?render={{ RECAPTCHA_SITE_KEY }}"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: #050505;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
        }
        .logo {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff007f, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 0, 127, 0.1);
            border-top: 4px solid #ff007f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            margin: 0 0 10px;
            font-weight: 400;
        }
        p {
            color: #888;
            font-size: 0.9rem;
        }
        #status {
            margin-top: 20px;
            font-weight: 600;
            color: #00d2ff;
        }
        .error {
            color: #ff4b2b !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">OTAKULUX</div>
        <div class="loader"></div>
        <h2>Verifying Access</h2>
        <p>Please wait while we secure your connection...</p>
        <div id="status">Connecting to backend...</div>
    </div>

    <script>
        const SITE_KEY = "{{ RECAPTCHA_SITE_KEY }}";
        const TOKEN = "{{ TOKEN }}";
        const NOISE = "{{ NOISE }}";

        async function verify() {
            try {
                document.getElementById('status').innerText = "Generating security token...";

                // 1. Wait for 2.5 seconds as requested
                await new Promise(r => setTimeout(r, 2500));

                // 2. Execute reCAPTCHA v3
                grecaptcha.ready(function() {
                    grecaptcha.execute(SITE_KEY, {action: 'redirect_access'}).then(async function(captchaToken) {
                        document.getElementById('status').innerText = "Authenticating...";

                        try {
                            const response = await fetch('/api/get_redirect', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'X-Requested-With': 'XMLHttpRequest'
                                },
                                body: JSON.stringify({
                                    token: TOKEN,
                                    captcha: captchaToken
                                })
                            });

                            const result = await response.json();

                            if (result.success) {
                                document.getElementById('status').innerText = "Redirecting...";
                                window.location.href = result.url;
                            } else {
                                document.getElementById('status').classList.add('error');
                                document.getElementById('status').innerText = result.message || "Verification failed.";
                            }
                        } catch (err) {
                            document.getElementById('status').classList.add('error');
                            document.getElementById('status').innerText = "Network error. Please refresh.";
                        }
                    });
                });
            } catch (err) {
                console.error(err);
                document.getElementById('status').innerText = "An error occurred.";
            }
        }

        window.onload = verify;
    </script>
</body>
</html>
