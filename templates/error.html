<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>˹ sʏsᴛᴇᴍ ꜰᴀᴛᴀʟ ᴇʀʀᴏʀ ˼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
            background: #020617;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(239, 68, 68, 0.2);
            box-shadow: 0 0 60px rgba(239, 68, 68, 0.15);
        }

        .glow-red {
            filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.4));
        }
    </style>
</head>
<body class="p-4">
    <div class="glass-card max-w-md w-full p-10 rounded-[3rem] text-center space-y-10 relative">
        <div class="space-y-6">
            <div class="flex justify-center">
                <div class="p-6 bg-red-500/10 rounded-[2rem] border border-red-500/20 glow-red">
                    <i class="fas fa-skull-crossbones text-6xl text-red-500"></i>
                </div>
            </div>
            <div class="space-y-2">
                <h1 class="text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-red-500 to-rose-500">
                    ˹ sʏsᴛᴇᴍ ꜰᴀᴛᴀʟ ˼
                </h1>
                <p class="text-slate-400 text-xs font-bold tracking-[0.2em] uppercase">💎 ᴀɴ ᴜɴᴇxᴘᴇᴄᴛᴇᴅ ᴀɴᴏᴍᴀʟʏ 💎</p>
            </div>
        </div>

        <p class="text-slate-300 text-sm leading-relaxed px-4 font-medium">
            ᴛʜᴇ ᴇɴɢɪɴᴇ ᴇɴᴄᴏᴜɴᴛᴇʀᴇᴅ ᴀ ꜰᴀᴛᴀʟ ᴀɴᴏᴍᴀʟʏ ᴡʜɪʟᴇ ᴘʀᴏᴄᴇssɪɴɢ ʏᴏᴜʀ ʀᴇǫᴜᴇsᴛ. ᴘʟᴇᴀsᴇ ʀᴇᴛᴜʀɴ ᴛᴏ ᴛʜᴇ sᴜᴘʀᴇᴍᴇ ᴄᴏᴍᴍᴀɴᴅ ᴄᴇɴᴛᴇʀ.
        </p>

        <div class="pt-8 border-t border-slate-800">
            <button onclick="location.href='https://t.me/AniZoneFlix'" class="w-full py-4 bg-red-500 hover:bg-red-400 text-white rounded-[1.5rem] font-black uppercase tracking-widest text-sm transition-all shadow-lg shadow-red-500/25">
                ⚡️ ʀᴇᴛᴜʀɴ ᴛᴏ ʙᴏᴛ ⚡️
            </button>
            <p class="text-[9px] text-slate-600 font-black uppercase tracking-[0.2em] mt-6">ɪᴅ: ᴀɴɪᴢᴏɴᴇꜰʟɪx-ꜰᴀᴛᴀʟ-ᴠ𝟻</p>
        </div>
    </div>
</body>
</html>
