<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Verification | OTAKULUX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.google.com/recaptcha/api.js?render={{ RECAPTCHA_SITE_KEY }}"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #0d1117, #161b22, #010409);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c9d1d9;
            margin: 0;
            overflow: hidden;
        }

        .glass-panel {
            background: rgba(13, 17, 23, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            border-radius: 1.5rem;
            text-align: center;
        }

        .timer-circle {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 255, 204, 0.05);
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 204, 0.2);
        }

        .glow-text {
            color: #00ffcc;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #fff;
            border-bottom-color: #00ffcc;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(3600deg); }
        }

        .btn-retry {
            background: linear-gradient(135deg, #00ffcc 0%, #0066ff 100%);
            color: #000;
            font-weight: 700;
            padding: 10px 25px;
            border-radius: 8px;
            transition: transform 0.2s;
        }

        .btn-retry:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="glass-panel">
        <div id="header-section" class="mb-8">
            <h1 class="text-3xl font-bold glow-text mb-2">OTAKULUX</h1>
            <p class="text-slate-400 text-sm">Anti-Bypass Protection Active</p>
        </div>

        <div id="stage-timer">
            <div class="timer-circle">
                <span id="countdown" class="text-4xl font-bold text-white">180</span>
            </div>
            <p class="text-sm text-slate-500 mb-4">Please wait while we verify your connection security...</p>
            <div class="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-teal-400 h-full transition-all duration-1000" style="width: 0%"></div>
            </div>
        </div>

        <div id="stage-loading" class="hidden">
            <span class="loader"></span>
            <p class="mt-6 text-teal-400 font-semibold animate-pulse">Analyzing reCAPTCHA Tokens...</p>
        </div>

        <div id="stage-error" class="hidden">
            <div class="bg-red-500/10 p-4 rounded-xl mb-6">
                <i class="fas fa-shield-virus text-red-500 text-4xl mb-3"></i>
                <h3 class="text-red-500 font-bold text-lg" id="error-title">Verification Failed</h3>
                <p class="text-slate-400 text-xs mt-1" id="error-desc">High risk activity detected.</p>
            </div>
            <button onclick="location.reload()" class="btn-retry">Try Again</button>
        </div>

        <div id="stage-success" class="hidden text-green-400">
            <i class="fas fa-check-double text-5xl mb-4"></i>
            <h2 class="text-2xl font-bold">Safe Access Granted</h2>
            <p class="text-slate-400 text-sm">Redirecting to content...</p>
        </div>

        <div class="mt-10 pt-6 border-t border-white/5 flex items-center justify-center gap-2 text-[10px] text-slate-600 uppercase tracking-widest">
            <i class="fas fa-fingerprint"></i>
            <span>Session: {{ SESSION_ID }}</span>
        </div>
    </div>

    <script>
        const REQUIRED_TIME = 180;
        let timeLeft = REQUIRED_TIME;
        
        const countdownEl = document.getElementById('countdown');
        const progressBar = document.getElementById('progress-bar');
        
        const stageTimer = document.getElementById('stage-timer');
        const stageLoading = document.getElementById('stage-loading');
        const stageError = document.getElementById('stage-error');
        const stageSuccess = document.getElementById('stage-success');

        // 1. Start the Timer
        const timerInterval = setInterval(() => {
            timeLeft--;
            
            // Update UI
            countdownEl.textContent = timeLeft;
            const progress = ((REQUIRED_TIME - timeLeft) / REQUIRED_TIME) * 100;
            progressBar.style.width = `${progress}%`;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                triggerRecaptcha();
            }
        }, 1000);

        // 2. Trigger reCAPTCHA v3 ONLY after 180s
        function triggerRecaptcha() {
            stageTimer.classList.add('hidden');
            stageLoading.classList.remove('hidden');

            grecaptcha.ready(function() {
                grecaptcha.execute('{{ RECAPTCHA_SITE_KEY }}', {action: 'verify'}).then(token => {
                    submitVerification(token);
                });
            });
        }

        // 3. Send to Backend for Strict Check
        async function submitVerification(token) {
            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: token,
                        session_id: "{{ SESSION_ID }}",
                        payload: "{{ PAYLOAD }}"
                    })
                });

                const data = await response.json();

                if (data.success) {
                    stageLoading.classList.add('hidden');
                    stageSuccess.classList.remove('hidden');
                    window.location.href = data.redirect;
                } else {
                    handleFailure(data.message);
                }
            } catch (err) {
                handleFailure("Network instability detected.");
            }
        }

        function handleFailure(msg) {
            stageLoading.classList.add('hidden');
            stageError.classList.remove('hidden');
            document.getElementById('error-desc').textContent = msg;
        }
    </script>
</body>
</html>
