<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Restricted | OTAKULUX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0b0e14; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .glass { background: rgba(239, 68, 68, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body class="p-4">
    <div class="glass max-w-md w-full p-10 rounded-[2.5rem] text-center space-y-8">
        <div class="w-20 h-20 bg-red-500/10 rounded-3xl flex items-center justify-center mx-auto border border-red-500/20">
            <i class="fas fa-user-slash text-4xl text-red-500"></i>
        </div>

        <div class="space-y-3">
            <h1 class="text-3xl font-bold text-red-400">Access Restricted</h1>
            <p class="text-slate-400 leading-relaxed">{{ MESSAGE }}</p>
        </div>

        <!-- TIME_BOX_START -->
        <div class="bg-red-500/10 rounded-2xl p-6 border border-red-500/10">
            <p class="text-xs uppercase tracking-widest text-red-400/60 font-bold mb-2">Restriction Expires In</p>
            <div class="text-3xl font-mono font-bold text-red-400">{{ TIME_LEFT }}</div>
        </div>
        <!-- TIME_BOX_END -->

        <div class="pt-6 border-t border-white/5">
            <a href="https://t.me/OTAKULUX" class="text-slate-500 hover:text-teal-400 transition-colors text-sm font-medium">
                <i class="fab fa-telegram-plane mr-2"></i>Contact Support
            </a>
        </div>
    </div>
</body>
</html>
