<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Restricted | OTAKULUX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0b0e14;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            overflow: hidden;
        }

        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background:
                radial-gradient(circle at 100% 0%, rgba(239, 68, 68, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 0% 100%, rgba(239, 68, 68, 0.05) 0%, transparent 40%);
        }

        .glass-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(239, 68, 68, 0.2);
            box-shadow: 0 0 50px -10px rgba(239, 68, 68, 0.2);
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body class="p-4">
    <div class="bg-mesh"></div>

    <div class="max-w-md w-full relative">
        <div class="absolute -top-10 -left-10 w-32 h-32 bg-red-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-red-500/10 rounded-full blur-3xl"></div>

        <div class="glass-card rounded-[2.5rem] p-10 text-center relative overflow-hidden">
            <div class="shimmer absolute inset-0 opacity-20 pointer-events-none"></div>

            <div class="mb-8 relative">
                <div class="w-24 h-24 bg-red-500/10 rounded-3xl flex items-center justify-center mx-auto mb-6 border border-red-500/20 shadow-lg shadow-red-500/10">
                    <i class="fas fa-shield-halved text-5xl text-red-500 animate-pulse"></i>
                </div>
                <h1 class="text-4xl font-bold tracking-tight mb-4 text-red-400">Access Restricted</h1>
                <p class="text-slate-400 text-lg leading-relaxed px-2">{{ MESSAGE }}</p>
            </div>

            <!-- TIME_BOX_START -->
            <div class="bg-red-500/5 rounded-3xl p-8 border border-red-500/10 mb-8 backdrop-blur-sm">
                <p class="text-xs uppercase tracking-[0.2em] text-red-400/60 font-bold mb-4">Restriction Expires In</p>
                <div class="text-4xl font-mono font-bold text-red-500 tabular-nums">{{ TIME_LEFT }}</div>
            </div>
            <!-- TIME_BOX_END -->

            <div class="pt-8 border-t border-white/5 flex flex-col items-center gap-4">
                <a href="https://t.me/OTAKULUX" class="group flex items-center gap-3 text-slate-500 hover:text-red-400 transition-all duration-300">
                    <div class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center group-hover:bg-red-500/10 transition-colors">
                        <i class="fab fa-telegram-plane"></i>
                    </div>
                    <span class="font-medium">Contact Security Support</span>
                </a>
                <p class="text-[10px] text-slate-600 uppercase tracking-widest font-semibold mt-4">Security ID: OTAKULUX-SHIELD-V4</p>
            </div>
        </div>
    </div>
</body>
</html>
