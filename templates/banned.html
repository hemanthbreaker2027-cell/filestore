<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | OTAKULUX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f12;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 77, 77, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
    </style>
</head>
<body class="p-4">
    <div class="glass max-w-md w-full p-10 rounded-2xl text-center space-y-6">
        <div class="flex justify-center">
            <div class="p-6 bg-red-500/10 rounded-full">
                <i class="fas fa-user-slash text-5xl text-red-500"></i>
            </div>
        </div>
        <h1 class="text-3xl font-bold text-red-500">Access Blocked</h1>
        <div class="space-y-4">
            <p class="text-slate-400 leading-relaxed">{{ MESSAGE }}</p>

            <!-- TIME_BOX_START -->
            <div class="py-4 px-6 bg-red-500/5 rounded-xl border border-red-500/10">
                <p class="text-xs uppercase tracking-widest text-slate-500 mb-1">Block expires in</p>
                <p class="text-2xl font-mono font-bold text-teal-400">{{ TIME_LEFT }}</p>
            </div>
            <!-- TIME_BOX_END -->
        </div>
        <p class="text-sm text-slate-500 italic">Automated security monitoring is active. Do not attempt to bypass.</p>
        <div class="pt-6">
            <a href="https://t.me/OTAKULUX" class="inline-flex items-center space-x-2 text-teal-400 hover:text-teal-300 transition-colors">
                <i class="fab fa-telegram"></i>
                <span>Contact Support</span>
            </a>
        </div>
    </div>
</body>
</html>
