<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>˹ ᴀᴄᴄᴇss ʀᴇsᴛʀɪᴄᴛᴇᴅ ˼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
            background: #020617;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(239, 68, 68, 0.2);
            box-shadow: 0 0 60px rgba(239, 68, 68, 0.15);
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(239, 68, 68, 0.1), transparent);
            background-size: 200% 100%;
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .glow-red {
            filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.4));
        }
    </style>
</head>
<body class="p-4">
    <div class="glass-card max-w-md w-full p-10 rounded-[3rem] text-center space-y-10 relative overflow-hidden">
        <div class="shimmer absolute inset-0 pointer-events-none opacity-30"></div>

        <div class="space-y-6">
            <div class="flex justify-center">
                <div class="p-6 bg-red-500/10 rounded-[2rem] border border-red-500/20 glow-red animate-pulse">
                    <i class="fas fa-shield-halved text-6xl text-red-500"></i>
                </div>
            </div>
            <div class="space-y-2">
                <h1 class="text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-red-500 to-rose-500">
                    ˹ ʀᴇsᴛʀɪᴄᴛᴇᴅ ˼
                </h1>
                <p class="text-slate-400 text-sm font-bold tracking-widest uppercase">💎 sᴇᴄᴜʀɪᴛʏ ᴠɪᴏʟᴀᴛɪᴏɴ 💎</p>
            </div>
        </div>

        <div class="space-y-8">
            <p class="text-slate-300 text-sm leading-relaxed px-4 font-medium">
                {{ MESSAGE }}
            </p>

            <!-- TIME_BOX_START -->
            <div class="p-8 bg-red-500/5 rounded-[2rem] border border-red-500/10 space-y-4">
                <p class="text-[10px] uppercase tracking-[0.3em] text-red-400/60 font-black">˹ ᴛɪᴍᴇ ʀᴇᴍᴀɪɴɪɴɢ ˼</p>
                <div class="text-4xl font-black text-red-500 tabular-nums tracking-tighter">{{ TIME_LEFT }}</div>
            </div>
            <!-- TIME_BOX_END -->
        </div>

        <div class="pt-8 border-t border-slate-800">
            <div class="flex flex-col items-center space-y-6">
                <a href="https://t.me/AniZoneFlix" class="px-10 py-4 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-[1.5rem] transition-all transform hover:scale-105 font-black text-xs uppercase tracking-widest border border-slate-700">
                    🛡 ᴄᴏɴᴛᴀᴄᴛ sᴜᴘᴘᴏʀᴛ 🛡
                </a>
                <p class="text-[9px] text-slate-600 font-black uppercase tracking-[0.2em]">ɪᴅ: ᴀɴɪᴢᴏɴᴇꜰʟɪx-sʜɪᴇʟᴅ-ᴠ𝟻</p>
            </div>
        </div>
    </div>
</body>
</html>
