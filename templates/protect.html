<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Link Protection | OTAKULUX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.google.com/recaptcha/api.js?render={{ RECAPTCHA_SITE_KEY }}"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .loader-ring {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(56, 189, 248, 0.1);
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-bar {
            height: 4px;
            background: #38bdf8;
            width: 0%;
            transition: width 0.1s linear;
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="p-4">
    <div class="glass-card max-w-md w-full p-8 rounded-3xl text-center space-y-8 relative overflow-hidden">
        <!-- Progress bar at top -->
        <div class="absolute top-0 left-0 w-full h-1 bg-slate-800">
            <div id="progress" class="progress-bar"></div>
        </div>

        <div class="space-y-4">
            <div class="flex justify-center">
                <div class="p-4 bg-sky-500/10 rounded-2xl floating">
                    <i class="fas fa-shield-halved text-5xl text-sky-400"></i>
                </div>
            </div>
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-indigo-400">
                Link Protection
            </h1>
            <p class="text-slate-400 text-sm">Validating your connection to ensure a secure redirect.</p>
        </div>

        <div id="status-container" class="space-y-6">
            <div id="timer-box">
                <div class="flex justify-center mb-4">
                    <div class="loader-ring"></div>
                </div>
                <div class="text-4xl font-bold text-white" id="seconds">7</div>
                <p class="text-slate-500 text-xs mt-2 uppercase tracking-widest font-semibold">Security Check in Progress</p>
            </div>

            <div id="loading-state" class="hidden">
                <div class="flex flex-col items-center space-y-4">
                    <div class="loader-ring"></div>
                    <p class="text-sky-400 font-semibold animate-pulse">Finalizing Verification...</p>
                </div>
            </div>

            <div id="error-state" class="hidden">
                <div class="p-4 bg-red-500/10 border border-red-500/20 rounded-xl">
                    <i class="fas fa-circle-exclamation text-red-400 text-2xl mb-2"></i>
                    <p class="text-red-400 text-sm font-medium" id="error-msg">Verification Failed</p>
                    <button onclick="location.reload()" class="mt-4 px-6 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg transition-all text-sm font-bold">
                        Retry Security Check
                    </button>
                </div>
            </div>
        </div>

        <div class="pt-6 border-t border-slate-700/50">
            <div class="flex items-center justify-center space-x-3 text-slate-500">
                <i class="fab fa-google text-lg"></i>
                <span class="text-xs font-medium">Protected by reCAPTCHA Enterprise</span>
            </div>
        </div>
    </div>

    <script>
        let timeLeft = 7;
        const totalTime = 7;
        const secondsEl = document.getElementById('seconds');
        const progressEl = document.getElementById('progress');
        const timerBox = document.getElementById('timer-box');
        const loadingState = document.getElementById('loading-state');
        const errorState = document.getElementById('error-state');

        const timer = setInterval(() => {
            timeLeft -= 0.1;
            const displaySec = Math.ceil(timeLeft);
            if (displaySec >= 0) secondsEl.textContent = displaySec;

            const percentage = ((totalTime - timeLeft) / totalTime) * 100;
            progressEl.style.width = percentage + '%';

            if (timeLeft <= 0) {
                clearInterval(timer);
                performVerification();
            }
        }, 100);

        function performVerification() {
            timerBox.classList.add('hidden');
            loadingState.classList.remove('hidden');

            grecaptcha.ready(function() {
                grecaptcha.execute('{{ RECAPTCHA_SITE_KEY }}', {action: 'verify'}).then(function(token) {
                    sendToBackend(token);
                });
            });
        }

        async function sendToBackend(token) {
            try {
                const response = await fetch('/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        recaptchaToken: token,
                        url: "{{ ENCODED_URL }}"
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Success! Redirect to the wrapped URL
                    window.location.href = data.data.redirect;
                } else {
                    showError(data.message || 'Security validation failed');
                }
            } catch (err) {
                showError('Network error. Please check your connection.');
            }
        }

        function showError(msg) {
            loadingState.classList.add('hidden');
            errorState.classList.remove('hidden');
            document.getElementById('error-msg').textContent = msg;
        }
    </script>
</body>
</html>
