<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>˹ ᴀɴɪᴢᴏɴᴇꜰʟɪx sᴇᴄᴜʀᴇ ᴘʀᴏᴛᴇᴄᴛɪᴏɴ ˼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap');

        :root {
            --primary: #38bdf8;
            --accent: #818cf8;
            --glass: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #020617;
            background-image:
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(129, 140, 248, 0.15) 0px, transparent 50%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .glass-container {
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 2.5rem;
            width: 100%;
            max-width: 450px;
            position: relative;
            overflow: hidden;
        }

        .anime-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(to bottom, rgba(56, 189, 248, 0.2), transparent);
            z-index: 0;
        }

        .glow-effect {
            position: absolute;
            width: 150px;
            height: 150px;
            background: var(--primary);
            filter: blur(80px);
            opacity: 0.2;
            z-index: -1;
            border-radius: 50%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 15px 25px -5px rgba(56, 189, 248, 0.5);
        }

        .btn-primary:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            background: #1e293b;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            background-size: 200% 100%;
            animation: shimmer 2.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body>
    <div class="glow-effect" style="top: 10%; left: 10%;"></div>
    <div class="glow-effect" style="bottom: 10%; right: 10%;"></div>

    <div class="glass-container p-8 sm:p-10 text-center z-10">
        <div class="anime-overlay"></div>

        <div class="relative z-10 space-y-8">
            <div class="flex justify-center">
                <div class="p-5 bg-sky-500/10 rounded-3xl border border-sky-500/20 shadow-inner">
                    <i class="fas fa-shield-halved text-5xl text-sky-400"></i>
                </div>
            </div>

            <div class="space-y-2">
                <h1 class="text-3xl sm:text-4xl font-black tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-indigo-400">
                    ˹ ᴀɴɪᴢᴏɴᴇꜰʟɪx ˼
                </h1>
                <p class="text-slate-400 text-xs font-bold tracking-[0.25em] uppercase shimmer">sᴇᴄᴜʀᴇ ʟɪɴᴋ ᴘʀᴏᴛᴇᴄᴛɪᴏɴ</p>
            </div>

            <div id="interaction-area" class="min-h-[220px] flex flex-col items-center justify-center space-y-6">
                <!-- Timer Display -->
                <div id="timer-box" class="space-y-4">
                    <div class="text-6xl font-black text-sky-400" id="timer">10</div>
                    <p class="text-slate-500 text-[10px] font-bold uppercase tracking-tighter">ᴘʟᴇᴀsᴇ ᴡᴀɪᴛ ғᴏʀ ᴛʜᴇ sᴇᴄᴜʀᴇ ᴛɪᴍᴇʀ</p>
                </div>

                <!-- Verify Button (Initially Hidden/Disabled) -->
                <div id="action-box" class="w-full space-y-4 hidden">
                    <button id="verify-btn" onclick="startVerification()" class="btn-primary w-full py-5 rounded-2xl text-white font-black text-lg uppercase tracking-widest flex items-center justify-center space-x-3">
                        <span>⚡️ ᴄᴏɴᴛɪɴᴜᴇ ⚡️</span>
                    </button>
                    <p class="text-slate-500 text-[10px] font-bold uppercase tracking-tighter">ᴄʟɪᴄᴋ ᴛᴏ ᴜɴʟᴏᴄᴋ ʏᴏᴜʀ ᴅᴇsᴛɪɴᴀᴛɪᴏɴ</p>
                </div>

                <!-- Loading State -->
                <div id="loading-state" class="hidden space-y-4">
                    <div class="flex justify-center">
                        <div class="spinner border-4 w-12 h-12"></div>
                    </div>
                    <p class="text-sky-400 font-black text-sm tracking-widest animate-pulse uppercase">˹ ꜰɪɴᴀʟɪᴢɪɴɢ ᴄʜᴇᴄᴋ ˼</p>
                </div>

                <!-- Error State -->
                <div id="error-state" class="hidden w-full">
                    <div class="p-6 bg-red-500/10 border border-red-500/20 rounded-3xl space-y-4">
                        <i class="fas fa-triangle-exclamation text-red-500 text-3xl"></i>
                        <p id="error-msg" class="text-red-400 text-sm font-black uppercase leading-relaxed"></p>
                        <button onclick="location.reload()" class="text-xs font-black text-white bg-slate-800 px-6 py-2 rounded-xl uppercase hover:bg-slate-700 transition-colors">
                            ᴛʀʏ ᴀɢᴀɪɴ
                        </button>
                    </div>
                </div>
            </div>

            <div class="pt-6 border-t border-slate-800">
                <div class="flex items-center justify-center space-x-3 text-slate-500">
                    <i class="fas fa-lock text-lg"></i>
                    <span class="text-[9px] font-black uppercase tracking-widest">sᴇᴄᴜʀᴇ ᴛɪᴍᴇʀ ᴠᴇʀɪꜰɪᴄᴀᴛɪᴏɴ</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const timerElement = document.getElementById('timer');
        const timerBox = document.getElementById('timer-box');
        const actionBox = document.getElementById('action-box');
        const loadingState = document.getElementById('loading-state');
        const errorState = document.getElementById('error-state');
        const verifyBtn = document.getElementById('verify-btn');

        let timeLeft = 10;
        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerBox.classList.add('hidden');
                actionBox.classList.remove('hidden');
            }
        }, 1000);

        async function startVerification() {
            actionBox.classList.add('hidden');
            loadingState.classList.remove('hidden');

            try {
                const urlParams = new URLSearchParams(window.location.search);
                const token = urlParams.get('data');

                if (!token) {
                    showError("˹ ɪɴᴠᴀʟɪᴅ sᴇssɪᴏɴ ˼");
                    return;
                }

                const response = await fetch('/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: token })
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = data.data.redirect;
                } else {
                    showError(data.message || '˹ ᴠᴇʀɪꜰɪᴄᴀᴛɪᴏɴ ꜰᴀɪʟᴇᴅ ˼');
                }
            } catch (err) {
                showError('˹ ɴᴇᴛᴡᴏʀᴋ ᴇʀʀᴏʀ ˼');
            }
        }

        function showError(msg) {
            actionBox.classList.add('hidden');
            loadingState.classList.add('hidden');
            timerBox.classList.add('hidden');
            errorState.classList.remove('hidden');
            document.getElementById('error-msg').textContent = msg;
        }
    </script>
</body>
</html>
