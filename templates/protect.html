<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>˹ ᴀɴɪᴢᴏɴᴇꜰʟɪx ᴘʀᴇᴍɪᴜᴍ ᴠᴇʀɪꜰɪᴄᴀᴛɪᴏɴ ˼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.google.com/recaptcha/api.js?render={{ RECAPTCHA_SITE_KEY }}"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.2);
            position: relative;
        }

        .glass-card::after {
            content: "";
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg, transparent, rgba(56, 189, 248, 0.3), transparent);
            border-radius: inherit;
            z-index: -1;
            animation: borderGlow 3s linear infinite;
        }

        @keyframes borderGlow {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        .loader-ring {
            width: 100px;
            height: 100px;
            border: 4px solid rgba(56, 189, 248, 0.1);
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            filter: drop-shadow(0 0 10px #38bdf8);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-bar {
            height: 6px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            width: 0%;
            transition: width 0.1s linear;
            box-shadow: 0 0 15px #38bdf8;
        }

        .floating {
            animation: floating 2s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body class="p-4">
    <div class="glass-card max-w-md w-full p-10 rounded-[2.5rem] text-center space-y-10 relative overflow-hidden">
        <!-- Progress bar at top -->
        <div class="absolute top-0 left-0 w-full h-1.5 bg-slate-900/50">
            <div id="progress" class="progress-bar"></div>
        </div>

        <div class="space-y-6">
            <div class="flex justify-center">
                <div class="p-6 bg-sky-500/10 rounded-[2rem] floating border border-sky-500/20">
                    <i class="fas fa-shield-halved text-6xl text-sky-400"></i>
                </div>
            </div>
            <div class="space-y-2">
                <h1 class="text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-sky-400 via-indigo-400 to-sky-400 animate-gradient-x">
                    ˹ ᴀɴɪᴢᴏɴᴇꜰʟɪx ˼
                </h1>
                <p class="text-slate-400 text-sm font-semibold tracking-wider uppercase">💎 sᴇᴄᴜʀᴇ ʟɪɴᴋ ᴇɴɢɪɴᴇ 💎</p>
            </div>
        </div>

        <div id="status-container" class="space-y-8">
            <div id="timer-box">
                <div class="flex justify-center mb-6">
                    <div class="loader-ring"></div>
                </div>
                <div class="text-6xl font-black text-white" id="seconds">4</div>
                <p class="text-sky-400/80 text-xs mt-4 uppercase tracking-[0.3em] font-bold shimmer">˹ ᴘʀᴇᴘᴀʀɪɴɢ ᴅᴇsᴛɪɴʏ ˼</p>
            </div>

            <div id="loading-state" class="hidden">
                <div class="flex flex-col items-center space-y-6">
                    <div class="loader-ring"></div>
                    <p class="text-sky-400 font-black text-lg animate-pulse tracking-widest">˹ ꜰɪɴᴀʟɪᴢɪɴɢ ᴠᴇʀɪꜰɪᴄᴀᴛɪᴏɴ ˼</p>
                </div>
            </div>

            <div id="error-state" class="hidden">
                <div class="p-8 bg-red-500/5 border border-red-500/20 rounded-[2rem]">
                    <i class="fas fa-circle-exclamation text-red-500 text-4xl mb-4"></i>
                    <p class="text-red-400 text-lg font-black" id="error-msg">˹ ᴠᴇʀɪꜰɪᴄᴀᴛɪᴏɴ ꜰᴀɪʟᴇᴅ ˼</p>
                    <button onclick="location.reload()" class="mt-6 px-10 py-4 bg-sky-500 hover:bg-sky-400 text-white rounded-[1.5rem] transition-all transform hover:scale-105 active:scale-95 font-black text-sm uppercase tracking-widest shadow-lg shadow-sky-500/25">
                        ⚡️ ᴛʀʏ ᴀɢᴀɪɴ ⚡️
                    </button>
                </div>
            </div>
        </div>

        <div class="pt-8 border-t border-slate-700/30">
            <div class="flex items-center justify-center space-x-4 text-slate-500">
                <i class="fab fa-google text-xl hover:text-sky-400 transition-colors"></i>
                <span class="text-[10px] font-black uppercase tracking-[0.2em]">ᴘᴏᴡᴇʀᴇᴅ ʙʏ ʀᴇᴄᴀᴘᴛᴄʜᴀ ᴠ𝟹</span>
            </div>
        </div>
    </div>

    <script>
        // ANTI-AUTOMATION: Check for suspicious environment
        if (window.navigator.webdriver || window.outerWidth === 0 || window.outerHeight === 0) {
             document.body.innerHTML = "<div class='text-red-500 font-bold p-20'>˹ sᴇᴄᴜʀɪᴛʏ ᴠɪᴏʟᴀᴛɪᴏɴ: ᴀᴜᴛᴏᴍᴀᴛɪᴏɴ ᴅᴇᴛᴇᴄᴛᴇᴅ ˼</div>";
             throw new Error("Automation detected");
        }

        let timeLeft = 4.0;
        const totalTime = 4.0;
        const secondsEl = document.getElementById('seconds');
        const progressEl = document.getElementById('progress');
        const timerBox = document.getElementById('timer-box');
        const loadingState = document.getElementById('loading-state');
        const errorState = document.getElementById('error-state');

        const timer = setInterval(() => {
            timeLeft -= 0.1;
            const displaySec = Math.ceil(timeLeft);
            if (displaySec >= 0) secondsEl.textContent = displaySec;

            const percentage = ((totalTime - timeLeft) / totalTime) * 100;
            progressEl.style.width = percentage + '%';

            if (timeLeft <= 0) {
                clearInterval(timer);
                performVerification();
            }
        }, 100);

        function performVerification() {
            timerBox.classList.add('hidden');
            loadingState.classList.remove('hidden');

            grecaptcha.ready(function() {
                try {
                    grecaptcha.execute('{{ RECAPTCHA_SITE_KEY }}', {action: 'verify'}).then(function(token) {
                        if (!token) {
                             showError("˹ ʀᴇᴄᴀᴘᴛᴄʜᴀ ᴛᴏᴋᴇɴ ᴍɪssɪɴɢ ˼");
                             return;
                        }
                        sendToBackend(token);
                    });
                } catch (e) {
                    showError("˹ sᴇᴄᴜʀɪᴛʏ ᴇɴɢɪɴᴇ ᴇʀʀᴏʀ ˼");
                }
            });
        }

        async function sendToBackend(token) {
            try {
                const response = await fetch('/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        recaptchaToken: token,
                        url: "{{ ENCODED_URL }}"
                    })
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = data.data.redirect;
                } else {
                    showError(data.message || '˹ sᴇᴄᴜʀɪᴛʏ ꜰᴀɪʟᴇᴅ ˼');
                }
            } catch (err) {
                showError('˹ ɴᴇᴛᴡᴏʀᴋ ᴇʀʀᴏʀ ˼');
            }
        }

        function showError(msg) {
            loadingState.classList.add('hidden');
            errorState.classList.remove('hidden');
            document.getElementById('error-msg').textContent = msg;
        }
    </script>
</body>
</html>
